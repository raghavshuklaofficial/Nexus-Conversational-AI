# Nexus AI — Full Platform Docker Compose
# Run: docker compose up -d

services:
  # ---- API Server ----
  nexus-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nexus-api
    ports:
      - "8000:8000"
    environment:
      - NEXUS_ENVIRONMENT=production
      - NEXUS_DEBUG=false
      - NEXUS_API_HOST=0.0.0.0
      - NEXUS_API_PORT=8000
      - NEXUS_LOG_LEVEL=INFO
      - NEXUS_CACHE_BACKEND=redis
      - NEXUS_CACHE_REDIS_URL=redis://redis:6379/0
      - NEXUS_VECTOR_STORE_BACKEND=qdrant
      - NEXUS_QDRANT_URL=http://qdrant:6333
      - NEXUS_KAFKA_ENABLED=true
      - NEXUS_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - NEXUS_LLM_PROVIDER=local
      - NEXUS_LLM_MODEL=gpt2
    volumes:
      - model-cache:/app/.cache
      - huggingface-cache:/home/nexus/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - nexus-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---- Ingestion Worker ----
  nexus-worker-ingest:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nexus-worker-ingest
    command: ["python", "-m", "nexus.workers.ingest_worker"]
    environment:
      - NEXUS_ENVIRONMENT=production
      - NEXUS_CACHE_BACKEND=redis
      - NEXUS_CACHE_REDIS_URL=redis://redis:6379/0
      - NEXUS_QDRANT_URL=http://qdrant:6333
      - NEXUS_KAFKA_ENABLED=true
      - NEXUS_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - model-cache:/app/.cache
      - huggingface-cache:/home/nexus/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexus-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    networks:
      - nexus-network
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Qdrant Vector Database ----
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - nexus-network
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Kafka ----
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexus-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: nexus-kafka-cluster-001
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---- Kafka UI ----
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nexus-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nexus
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nexus-network
    restart: unless-stopped
    profiles:
      - tools

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.initial.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - nexus-api
    networks:
      - nexus-network
    restart: unless-stopped

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nexus-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nexus-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  nexus-network:
    driver: bridge

volumes:
  model-cache:
  huggingface-cache:
  redis-data:
  qdrant-data:
  kafka-data:
  prometheus-data:
  grafana-data:
