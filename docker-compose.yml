# Docker Compose for Nexus Conversational AI
# ==========================================

services:
  # Main API Service
  nexus-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nexus-api
    ports:
      - "8000:8000"
    environment:
      - NEXUS_ENVIRONMENT=production
      - NEXUS_DEBUG=false
      - NEXUS_HOST=0.0.0.0
      - NEXUS_PORT=8000
      - NEXUS_LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - model-cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    networks:
      - nexus-network
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy with SSL (Production)
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/nginx/ssl:ro
    depends_on:
      - nexus-api
    networks:
      - nexus-network
    restart: unless-stopped

  # Certbot for automatic Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: nexus-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - nginx
    # Renew certificates every 12 hours (runs, checks, exits)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

  # Prometheus Metrics (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nexus-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana Dashboard (Monitoring)
  grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - nexus-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  nexus-network:
    driver: bridge

volumes:
  model-cache:
    driver: local
  redis-data:
    driver: local
  certbot-webroot:
    driver: local
  certbot-certs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
